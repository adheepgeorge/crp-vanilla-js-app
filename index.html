<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Meta tags -->
  <!-- charset meta tag tells the browser to use UTF-8 encoding when interpreting the HTML document. 
  It's crucial to include this tag early in your HTML document (ideally within the first 1024 bytes) 
  to ensure proper character rendering.
  Without UTF-8, you might encounter issues like:
  - Question marks (?) instead of special characters
  - Random symbols instead of proper text
  - Broken emoji displays
  - Incorrect rendering of non-English text
  This is why UTF-8 has become the de facto standard for web development 
  and is recommended by the W3C (World Wide Web Consortium). -->
  <meta charset="UTF-8">
  <!-- Controls how a webpage is displayed on mobile devices
  Without this tag, mobile browsers might render the page as if it 
  were on a desktop screen, causing users to need to zoom and pan -->
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <!-- Title -->
  <title>Vanilla JS App</title>
</head>

<body>
  <div id="app">
    <h1>Welcome to My Vanilla JS App</h1>
    <p>This is a simple application built with vanilla JavaScript.</p>
  </div>
</body>

</html>
